name: Closet
options:
  bundleIdPrefix: com.closet
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSCameraUsageDescription: "Closet needs camera access to photograph your clothing items."
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Closet needs photo library access to import photos of your clothing."
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Closet uses your location to fetch local weather for outfit suggestions."
    INFOPLIST_KEY_NSCalendarsUsageDescription: "Closet uses your calendar to suggest outfits for upcoming events."
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES

packages:
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    from: "0.15.3"

targets:
  Closet:
    type: application
    platform: iOS
    sources:
      - path: Closet/Sources
      - path: Closet/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.closet.stylist
        PRODUCT_MODULE_NAME: Closet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Closet
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - package: SQLite
    entitlements:
      path: Closet/Resources/Closet.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.closet.stylist

  ClosetWatch:
    type: application
    platform: watchOS
    sources:
      - path: ClosetWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.closet.stylist.watchkitapp
        PRODUCT_MODULE_NAME: ClosetWatch
        INFOPLIST_FILE: ClosetWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

